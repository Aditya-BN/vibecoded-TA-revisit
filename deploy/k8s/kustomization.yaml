# Agrisoil dev stack. Apply with:
#   ./deploy/k8s/make-secrets.sh        # once: random passwords into Kubernetes Secrets
#   kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agrisoil-dev
labels:
  - pairs: {app.kubernetes.io/part-of: agrisoil}
resources:
  - namespace.yaml
  - mosquitto.yaml
  - postgres.yaml
  - nodered.yaml
  - dashboard.yaml
  - ingress.yaml
  - ../../nodered
  - ../../dashboard
configMapGenerator:
  - name: mosquitto-config
    files:
      - config/mosquitto.conf
      - config/acl
  - name: postgres-init
    files:
      - config/01-schema.sql
      - config/02-roles.sh
  # Dummy sensors + MQTT port lookup. Add a sensor here, then: kubectl apply -k deploy/k8s
  - name: nodered-env
    literals:
      - AGRI_DEVICES=Alat1,Alat2,Alat3
      - AGRI_LAT=-6.200000
      - AGRI_LNG=106.816666
      # Port /getngrokport hands to the ESP32. In-cluster: 1883. Real sensors: whatever exposes the broker.
      - AGRI_MQTT_PORT=1883
  - name: dashboard-env
    literals:
      - OFFLINE_AFTER_SECONDS=120
