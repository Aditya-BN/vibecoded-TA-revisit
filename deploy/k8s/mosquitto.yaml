apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data
  labels: {app.kubernetes.io/name: mosquitto}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  labels: {app.kubernetes.io/name: mosquitto}
spec:
  replicas: 1
  strategy: {type: Recreate}   # RWO volume, never two brokers at once
  selector:
    matchLabels: {app.kubernetes.io/name: mosquitto}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mosquitto}
    spec:
      securityContext:
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: passwd
          image: eclipse-mosquitto:2.0.22
          command: [sh, -c]
          args:
            - |
              set -eu
              umask 077
              mosquitto_passwd -b -c /mosquitto/auth/passwd nodered "$NODERED_PASSWORD"
              mosquitto_passwd -b /mosquitto/auth/passwd device "$DEVICE_PASSWORD"
          env:
            - name: NODERED_PASSWORD
              valueFrom: {secretKeyRef: {name: mosquitto-auth, key: nodered-password}}
            - name: DEVICE_PASSWORD
              valueFrom: {secretKeyRef: {name: mosquitto-auth, key: device-password}}
          volumeMounts:
            - {name: auth, mountPath: /mosquitto/auth}
            - {name: tmp, mountPath: /tmp}   # mosquitto_passwd writes a temp file
          securityContext: &sc
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.22
          ports:
            - {name: mqtt, containerPort: 1883}
          readinessProbe:
            tcpSocket: {port: mqtt}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: mqtt}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 128Mi}
          securityContext: *sc
          volumeMounts:
            - {name: data, mountPath: /mosquitto/data}
            - {name: auth, mountPath: /mosquitto/auth}
            - {name: config, mountPath: /mosquitto/config}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mosquitto-data}
        - name: auth
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: config
          configMap: {name: mosquitto-config, defaultMode: 0440}   # group 1883 via fsGroup
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  labels: {app.kubernetes.io/name: mosquitto}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: mosquitto}
  ports:
    - {name: mqtt, port: 1883, targetPort: mqtt}
